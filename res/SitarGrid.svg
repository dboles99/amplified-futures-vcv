<!--
  SITAR GRID — 42 HP panel  |  Amplified Futures design system
  Panel: 630 × 380 px  (42 HP × 15 px/HP)
  Finish: dark oxidised steel (#1F2A1F)
  mm→px factor: 2.953

  Sequencer columns (mm → px):
    sX: [8,21,34,47,60,73,86,99,113,126] → [23.6,62.0,100.5,138.8,177.2,215.6,254.0,292.4,333.7,372.2]
  Seq rows:
    PITCH  knob y=32mm → 94.5px   lights y=22mm → 65.0px
    RES    knob y=54mm → 159.5px  lights y=44mm → 130.0px
    RIFF   knob y=76mm → 224.5px  lights y=66mm → 195.0px
  Right block x (mm→px):
    rX: [133,146,159,172,185,198] → [393.0,431.3,469.7,508.1,546.5,584.8]
  Right block rows y (mm→px):
    25→73.8  41→121.1  55→162.4  69→203.8  85→251.1  106→313.0
  I/O rows:
    y=106mm → 313.0px  (inputs)
    y=120mm → 354.5px  (outputs)
  Screws: (15,7.5) (615,7.5) (15,372.5) (615,372.5)
-->

<svg
