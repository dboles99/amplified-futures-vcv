name: Build

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    name: win-x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            make
            jq

      - name: Download Rack SDK 2.6.6
        run: |
          curl -L "https://vcvrack.com/downloads/Rack-SDK-2.6.6-win-x64.zip" -o Rack-SDK.zip
          7z x Rack-SDK.zip
        shell: pwsh

      - name: Build plugin
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          RACK_DIR="$GITHUB_WORKSPACE/Rack-SDK" make -j4 dist

      - name: Run core tests
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE/tests"
          make test

      - uses: actions/upload-artifact@v4
        with:
          name: vcvplugin-win-x64
          path: dist/*.vcvplugin
          if-no-files-found: error

  # The library builds submissions for all three platforms from source, so a
  # compile error on mac or Linux is a rejection round-trip. Neither had ever
  # been compiled before 2.3.0.
  #
  # Both Mac slices are built on the arm64 runner. Rack supports this directly:
  # CROSS_COMPILE feeds --target to clang (compile.mk), and Apple's toolchain
  # targets x86_64 from Apple Silicon without a separate SDK. Matching each
  # slice to its own runner would be cleaner, but that means an Intel macOS
  # image, and those are being retired out from under exactly this kind of job.
  build-unix:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: lin-x64
            sdk: Rack-SDK-2.6.6-lin-x64.zip
            expect: x86-64
          - os: macos-latest
            arch: mac-arm64
            sdk: Rack-SDK-2.6.6-mac-arm64.zip
            expect: arm64
          - os: macos-latest
            arch: mac-x64
            sdk: Rack-SDK-2.6.6-mac-x64.zip
            cross: x86_64-apple-darwin
            expect: x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Download Rack SDK 2.6.6
        run: |
          curl -L "https://vcvrack.com/downloads/${{ matrix.sdk }}" -o Rack-SDK.zip
          unzip -q Rack-SDK.zip

      # CROSS_COMPILE is passed as an environment variable and is empty for the
      # native slices. GNU Make's ifdef treats an empty value as undefined, so
      # arch.mk falls through to detecting the host - no branching needed here.
      - name: Build plugin
        env:
          CROSS_COMPILE: ${{ matrix.cross }}
        run: RACK_DIR="$GITHUB_WORKSPACE/Rack-SDK" make -j4 dist

      # A cross-built binary cannot be run by the runner that produced it, so
      # the test suite is skipped for that slice alone rather than pretending.
      # The same sources are tested natively by the mac-arm64 job beside it.
      - name: Run core tests
        if: ${{ !matrix.cross }}
        run: cd tests && make test

      # Read the binary itself, not the filename. Rack derives both the target
      # and the package name from the same MACHINE, so a name-only check passes
      # by construction and proves nothing about what was actually emitted -
      # which is the whole risk of building an x64 slice on an arm64 host.
      - name: Verify the binary is the architecture it claims
        run: |
          bin=$(ls plugin.so plugin.dylib 2>/dev/null | head -1)
          [ -n "$bin" ] || { echo "::error::no built binary found"; exit 1; }
          desc=$(file -b "$bin")
          echo "$bin: $desc"
          case "$desc" in
            *${{ matrix.expect }}*) echo "OK: ${{ matrix.expect }}" ;;
            *) echo "::error::expected ${{ matrix.expect }}, got: $desc"; exit 1 ;;
          esac
          f=$(ls dist/*.vcvplugin)
          case "$f" in
            *-${{ matrix.arch }}.vcvplugin) echo "package: $(basename "$f")" ;;
            *) echo "::error::expected ${{ matrix.arch }} in $f"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: vcvplugin-${{ matrix.arch }}
          path: dist/*.vcvplugin
          if-no-files-found: error

  # The documentation checks existed but ran nowhere: CI compiled the plugin
  # and ran the C++ core suite, while check_wiki.py and its tests only ever ran
  # when someone remembered to. A check nothing invokes is a check that has
  # stopped, and the manual is the part of this repo most able to drift without
  # anyone noticing - drift is the whole thing check_wiki exists to catch.
  docs:
    name: docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --quiet pytest

      # The tests import check_wiki directly, so they run from tools/.
      - name: Test the checker
        run: cd tools && python -m pytest test_check_wiki.py -q

      # Offline only. --network fetches every image URL, which makes a green
      # build depend on githubusercontent being up.
      - name: Check the manual against the plugin
        run: python tools/check_wiki.py

  # Independent distribution. The VCV library builds from source and needs none
  # of this, but it is not carrying the plugin, so the GitHub release is the
  # only way anyone installs it - and until now that release held a Windows
  # build alone, which is most of the audience unable to install at all.
  release:
    name: attach binaries to the release
    # docs gates the release too. check_wiki only fails on structural faults -
    # a module with no page, an HP claim contradicting its panel, a link into
    # nothing - never on prose, so this cannot block a release over a typo. Any
    # of those shipping in a release is worse than the release waiting.
    needs: [build, build-unix, docs]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vcvplugin-*
          path: dist
          merge-multiple: true

      - name: Show what will be attached
        run: ls -lh dist/

      # Pushing a tag does not create a release - the two are separate objects,
      # and `gh release upload` fails with "release not found" against a tag
      # that has no release. v2.3.0's existed only because it was made by hand,
      # so the first tag to rely on this job produced four correct binaries and
      # published none of them. Create it if absent, then upload.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(ls dist/*.vcvplugin | wc -l)
          if [ "$n" -ne 4 ]; then
            echo "::error::expected 4 platform builds, found $n"
            exit 1
          fi
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "no release for ${GITHUB_REF_NAME} yet — creating it from the tag"
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-from-tag \
              --verify-tag
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/*.vcvplugin \
            --clobber --repo "${GITHUB_REPOSITORY}"
